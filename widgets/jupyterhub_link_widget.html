<!DOCTYPE html>
<!-- needs jupyterlab-open-url-parameter -->
<html>
<head>
    <title>Jupyter Notebook Link Generator</title>
    <script>
        const hubOptions = {
            "nmfs-openscapes": "https://nmfs-openscapes.2i2c.cloud",
            "workshop.nmfs-openscapes": "https://workshop.nmfs-openscapes.2i2c.cloud",
            "noaa.nmfs-openscapes": "https://noaa.nmfs-openscapes.2i2c.cloud",
            "openscapes": "https://openscapes.2i2c.cloud"
        };

        function getSelectedHubUrl() {
            let radios = document.getElementsByName("hub");
            for (let radio of radios) {
                if (radio.checked) {
                    return radio.value;
                }
            }
            return null;
        }

        function convertToRawUrl(githubUrl) {
            let match = githubUrl.match(/https:\/\/github\.com\/(.+?)\/(.+?)\/blob\/(.+)/);
            if (match) {
                return `https://raw.githubusercontent.com/${match[1]}/${match[2]}/${match[3]}`;
            }
            return githubUrl;
        }

        function openNotebook() {
            let hubUrl = getSelectedHubUrl();
            let notebookUrl = document.getElementById("notebook").value.trim();
            
            if (!hubUrl || !notebookUrl) {
                alert("Please select a hub and enter a notebook URL.");
                return;
            }
            
            let rawNotebookUrl = convertToRawUrl(notebookUrl);
            let encodedNotebookUrl = encodeURIComponent(rawNotebookUrl);
            let finalUrl = `${hubUrl}/hub/user-redirect/lab?fromURL=${encodedNotebookUrl}`;
            
            window.open(finalUrl, '_blank');
        }

        window.onload = function() {
            let notebookUrl = new URLSearchParams(window.location.search).get("notebook");
            if (notebookUrl) {
                document.getElementById("notebook").value = decodeURIComponent(notebookUrl);
            }
        };
    </script>
</head>
<body>
    <h2>Jupyter Notebook Link Generator</h2>
    <p><em>To open the notebook, the hub image must have jupyterlab-open-url-parameter installed.</em></p>

    <label>Choose a Hub:</label><br>
    <div style="margin-bottom: 1em;">
        <label><input type="radio" name="hub" value="https://nmfs-openscapes.2i2c.cloud"> nmfs-openscapes</label>
        <label><input type="radio" name="hub" value="https://workshop.nmfs-openscapes.2i2c.cloud"  checked> workshop.nmfs-openscapes</label>
        <label><input type="radio" name="hub" value="https://noaa.nmfs-openscapes.2i2c.cloud"> noaa.nmfs-openscapes</label>
        <label><input type="radio" name="hub" value="https://openscapes.2i2c.cloud"> openscapes</label>
    </div>

    <label for="notebook">Notebook URL:</label>
    <input type="text" id="notebook" placeholder="https://github.com/your/repo/blob/main/notebook.ipynb" size="80"><br><br>
    
    <button onclick="openNotebook()">Open Notebook</button>
</body>
</html>
